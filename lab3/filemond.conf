# Конфигурация демона filemond
# Формат: ключ = значение; '#' — комментарий.

# Каталог, за которым следит демон (обходится рекурсивно)
directory = /tmp/filemond-watch

# Интервал между проверками, в секундах
interval = 5

# Файл журнала и pid-файл (необязательно; пути абсолютные)
logfile = /tmp/filemond.log
pidfile = /tmp/filemond.pid
